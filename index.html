<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPOT Help & Support</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
<div class="header">
<img src="805958109_1365742875290910_1093649627260317834_n.png" alt="Support Logo" class="header-logo">
Help &amp; Support
</div>
<div class="chat-area" id="chatArea"></div>

<div class="quick-panel">
<div class="quick-label" id="quickLabel">Please select an issue</div>
<div class="quick-options" id="quickOptions"></div>
</div>

<div class="input-bar">
<input type="text" id="userInput" placeholder="Enter your concern here..." />
<button class="send-btn" id="sendBtn">&#10148;</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
